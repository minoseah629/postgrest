name: OpenAPI policy

# Spins up Postgres + PostgREST, fetches the generated OpenAPI spec,
# and checks it with Spectral (OWASP ruleset) and OPA (Rego).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "policy/openapi/**"
      - "scripts/lint-openapi.sh"
      - ".github/workflows/openapi-policy.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed example schema
        env:
          PGPASSWORD: pass
        run: |
          psql -h localhost -U postgres <<'SQL'
          create schema api;
          create table api.todos (
            id uuid primary key default gen_random_uuid(),
            task text not null,
            done boolean not null default false
          );
          create role anon nologin;
          grant usage on schema api to anon;
          grant select on api.todos to anon;
          create role authenticator noinherit login password 'pass';
          grant anon to authenticator;
          SQL

      - name: Start PostgREST
        run: |
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://authenticator:pass@localhost:5432/postgres" \
            -e PGRST_DB_SCHEMAS=api -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="reallyreallyreallyreallyverysafe123" \
            postgrest/postgrest
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          docker logs pgrst
          exit 1

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Lint OpenAPI spec
        run: scripts/lint-openapi.sh http://localhost:3000/
