name: OpenAPI policy

# Builds PostgREST from this branch, starts it against Postgres, fetches the
# generated OpenAPI spec and checks it, unpatched, with Spectral (OWASP ruleset)
# and OPA (Rego).
# Runs on pull requests that touch the policy or spec code, or on demand
# (Actions tab -> Run workflow, once this file is on the default branch).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "policy/openapi/**"
      - "scripts/lint-openapi.sh"
      - "src/library/PostgREST/Response/OpenAPI.hs"
      - "src/library/PostgREST/Config.hs"
      - ".github/workflows/openapi-policy.yaml"

jobs:
  lint:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix

      - name: Build PostgREST from this branch
        run: nix-build -A postgrestStatic

      - name: Seed example schema
        env:
          PGPASSWORD: pass
        run: psql -h localhost -U postgres -f policy/openapi/dev/seed.sql

      - name: Start PostgREST
        env:
          PGRST_DB_URI: postgres://authenticator:pass@localhost:5432/postgres
          PGRST_DB_SCHEMAS: api
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: reallyreallyreallyreallyverysafe123
          PGRST_OPENAPI_SERVER_PROXY_URI: https://localhost
          PGRST_OPENAPI_SECURITY_ACTIVE: "true"
          PGRST_OPENAPI_RATE_LIMIT: "10"
          PGRST_OPENAPI_CONTACT_EMAIL: api@example.org
          PGRST_DB_MAX_ROWS: "1000"
        run: |
          result/bin/postgrest > postgrest.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          cat postgrest.log
          exit 1

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Lint OpenAPI spec (unpatched)
        run: scripts/lint-openapi.sh --raw http://localhost:3000/
