name: OpenAPI policy

# Spins up Postgres + PostgREST, fetches the generated OpenAPI spec,
# and checks it with Spectral (OWASP ruleset) and OPA (Rego).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "policy/openapi/**"
      - "scripts/lint-openapi.sh"
      - ".github/workflows/openapi-policy.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed example schema
        env:
          PGPASSWORD: pass
        run: psql -h localhost -U postgres -f policy/openapi/dev/seed.sql

      - name: Start PostgREST
        run: |
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://authenticator:pass@localhost:5432/postgres" \
            -e PGRST_DB_SCHEMAS=api -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="reallyreallyreallyreallyverysafe123" \
            -e PGRST_OPENAPI_SERVER_PROXY_URI=https://localhost \
            -e PGRST_OPENAPI_SECURITY_ACTIVE=true \
            -e PGRST_OPENAPI_RATE_LIMIT=10 \
            -e PGRST_DB_MAX_ROWS=1000 \
            postgrest/postgrest
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          docker logs pgrst
          exit 1

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Lint OpenAPI spec
        run: scripts/lint-openapi.sh http://localhost:3000/
