# Dev stack whose generated OpenAPI spec passes more of the policy checks.
#   docker compose -f policy/openapi/dev/docker-compose.yml up -d
#   scripts/lint-openapi.sh            # patches the spec with gateway behavior, then lints
#   curl -i localhost:${GATEWAY_PORT:-8080}/todos   # via the rate-limited gateway (GATEWAY_PORT=8081 if 8080 is taken)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"   # direct access for spec fetching only; clients use the gateway on :8080
    environment:
      PGRST_DB_URI: postgres://authenticator:pass@db:5432/postgres
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-reallyreallyreallyreallyverysafe123}
      # Spec advertises https; TLS itself must be terminated by a proxy in front.
      PGRST_OPENAPI_SERVER_PROXY_URI: https://localhost
      # Adds securityDefinitions (JWT) and a global security requirement to the spec.
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
      PGRST_OPENAPI_RATE_LIMIT: "10"
      # Caps result sets; the patched spec documents this as maxItems.
      PGRST_DB_MAX_ROWS: "1000"

  gateway:
    image: nginx:alpine
    depends_on:
      - postgrest
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
