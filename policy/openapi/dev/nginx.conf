# Gateway in front of PostgREST. Enforces what the patched OpenAPI spec documents:
#   - per-client rate limiting: 429 + Retry-After + X-RateLimit-Limit
#   - request size limits (URI/headers 8k, body 1m)
# NOTE: TLS is not terminated here (dev only). Terminate TLS at a real proxy/LB in production.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;

    large_client_header_buffers 4 8k;   # longer URIs/headers get 414/400
    client_max_body_size 1m;

    location / {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @ratelimited;

        add_header X-RateLimit-Limit 10 always;
        proxy_pass http://postgrest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location @ratelimited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-RateLimit-Limit 10 always;
        return 429 '{"code":"RATE_LIMITED","message":"Too many requests","details":null,"hint":"Retry after the number of seconds in Retry-After"}';
    }
}
